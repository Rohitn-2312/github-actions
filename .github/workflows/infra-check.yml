
name: Infrastructure Check

'on':
  workflow_call:
    inputs:
      working_dir:
        description: Directory containing Terraform code
        required: true
        type: string

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ inputs.working_dir }}
