
name: Build and Scan Image

'on':
  push:

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare lowercase image name
        id: image-name
        shell: bash
        run: |
          echo "image_name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, push and scan
        id: build
        uses: ./.github/actions/build-and-scan
        with:
          image_name: ${{ steps.image-name.outputs.image_name }}
          tag: ${{ github.sha }}
          dockerfile: Dockerfile
          context: .
          build_args: ""

      - name: Print image URI
        env:
          IMAGE_URI: ${{ steps.build.outputs.image_uri }}
        run: |
          echo "Published image: $IMAGE_URI"
